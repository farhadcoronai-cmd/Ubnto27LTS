[package]
name = "codm_rust_core"
version = "1.0.0"
edition = "2021"
description = "AmneziaWG 1.5/2.0 Config Optimizer, RFC 8484 DoH TUN Engine, and Concurrent RTT Benchmarker"

[lib]
name = "codm_rust_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
hickory-proto = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
